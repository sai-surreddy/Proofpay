services:
  - type: web
    name: proofpay
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: SIMULATION_MODE
        value: "false"
      - key: AUTO_RELEASE_CONFIDENCE
        value: "0.8"
      - key: AI_PROVIDER
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_TEXT_MODEL
        sync: false
      - key: NVIDIA_VISION_MODEL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CLAUDE_MODEL
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
