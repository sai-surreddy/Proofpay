<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ProofPay</title>
  <meta name="description" content="Money that only moves when work is proven. AI-verified milestone payments on PayPal." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a5cff'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="8" /><path d="M9 16.5l4.5 4.5L23 11.5" /></svg>
      </span>
      <span class="brand-name">ProofPay</span>
    </a>
    <div class="modes" id="modes"></div>
    <div class="role-switch" role="tablist" aria-label="Acting as">
      <span class="role-label">Acting as</span>
      <button data-role="payer" role="tab">Payer</button>
      <button data-role="payee" role="tab">Payee</button>
      <button data-role="reviewer" role="tab">Reviewer</button>
    </div>
  </header>

  <main id="app" class="container"></main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <div id="overlay" class="overlay" hidden>
    <div class="overlay-card">
      <div class="scanner" aria-hidden="true"><div class="scan-line"></div></div>
      <h3 id="overlay-title">Working…</h3>
      <ol id="overlay-steps" class="steps"></ol>
    </div>
  </div>

  <footer class="footer container">
    <p>ProofPay is a hackathon prototype running on the PayPal sandbox. Holding funds for others is regulated; a production launch needs escrow or money-transmission compliance and a licensed partner.</p>
  </footer>

  <script type="module" src="/app.js"></script>
</body>
</html>
